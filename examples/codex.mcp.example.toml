# Placeholder-only template. Merge the intended sections into your PRIVATE
# Codex config.toml; do not replace the entire file or commit completed values.
# Replace every <PLACEHOLDER> with a real absolute path. No variable expansion
# is implied. See docs/GETTING_STARTED.md for the directories and private file.

[mcp_servers.unofficial-bambu]
command = "<REPOSITORY_DIR>/tools/unofficial-bambu-mcp/.venv/Scripts/python.exe"
args = ["<REPOSITORY_DIR>/tools/unofficial-bambu-mcp/enhanced_server.py"]

[mcp_servers.unofficial-bambu.env]
BAMBU_STUDIO_EXE = "<BAMBU_STUDIO_EXE>"
BAMBU_STUDIO_RESOURCES = "<STUDIO_RESOURCES_DIR>"
BAMBU_STUDIO_DATA = "<STUDIO_DATA_DIR>"
LOCALAPPDATA = "<LOCAL_APP_DATA_DIR>"
UBMCP_DIR = "<PROJECT_OUTPUT_DIR>"
PYTHONIOENCODING = "utf-8"
PYTHONUTF8 = "0"
TEMP = "<MCP_TEMP_DIR>"
TMP = "<MCP_TEMP_DIR>"

[mcp_servers.bambu-printer]
command = "<NODE_EXE>"
args = ["--env-file=<LOCAL_APP_DATA_DIR>/BambuPrinterMCP/printer.env", "<REPOSITORY_DIR>/tools/bambu-printer-mcp/dist/index.js"]

[mcp_servers.bambu-printer.env]
MCP_TRANSPORT = "stdio"
